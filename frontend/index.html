<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Metrics Dashboard — rapyuta-robotics</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #f1f5f9;
      --card:      #ffffff;
      --border:    #e2e8f0;
      --text:      #1e293b;
      --muted:     #64748b;
      --indigo:    #6366f1;
      --indigo-lt: #eef2ff;
      --emerald:   #10b981;
      --amber:     #f59e0b;
      --rose:      #f43f5e;
      --slate:     #94a3b8;
      --hdr:       #0f172a;
      --radius:    10px;
      --shadow:    0 1px 4px rgba(0,0,0,.08), 0 2px 12px rgba(0,0,0,.06);
    }
    body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Header ── */
    .hdr { background: var(--hdr); color: #fff; padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 58px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
    .hdr-logo { font-size: 18px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; }
    .hdr-logo span { color: var(--indigo); }
    .hdr-spacer { flex: 1; }
    .sprint-select { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .sprint-select option { background: #1e293b; }
    .refresh-btn { background: none; border: 1px solid #334155; color: #94a3b8; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
    .refresh-btn:hover { border-color: var(--indigo); color: var(--indigo); }
    .refresh-btn:disabled { opacity: .4; cursor: not-allowed; }
    .current-badge { background: #065f46; color: #6ee7b7; font-size: 11px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
    .member-badge { background: #1e3a5f; color: #93c5fd; font-size: 11px; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }

    /* ── Nav tabs ── */
    .nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; }
    .nav-tab { padding: 12px 16px; font-size: 13px; font-weight: 500; color: var(--muted); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all .15s; }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--indigo); border-bottom-color: var(--indigo); }

    /* ── Layout ── */
    .page { padding: 24px; max-width: 1400px; margin: 0 auto; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }

    /* ── KPI Cards ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; box-shadow: var(--shadow); }
    .kpi-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px; }
    .kpi-value { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; margin-bottom: 6px; }
    .kpi-value.green { color: var(--emerald); }
    .kpi-value.amber { color: var(--amber); }
    .kpi-value.red   { color: var(--rose); }
    .kpi-trend { font-size: 12px; font-weight: 500; }
    .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* ── Chart cards ── */
    .chart-row { display: grid; gap: 16px; margin-bottom: 24px; }
    .chart-row-2 { grid-template-columns: 1fr 1fr; }
    .chart-row-3 { grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 900px) { .chart-row-2, .chart-row-3 { grid-template-columns: 1fr; } }
    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
    .chart-card-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .chart-card-title .badge { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
    .badge-tier2 { background: #dbeafe; color: #1d4ed8; }

    /* ── Comparison table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f8fafc; padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; border-bottom: 2px solid var(--border); white-space: nowrap; }
    td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    tr:hover td { background: #fafbfc; }
    .td-good  { color: var(--emerald); font-weight: 600; }
    .td-warn  { color: var(--amber);   font-weight: 600; }
    .td-bad   { color: var(--rose);    font-weight: 600; }
    .td-muted { color: var(--muted); }

    /* ── Notice ── */
    .notice { display: flex; gap: 12px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius); padding: 14px 16px; font-size: 13px; color: #1e40af; margin-bottom: 20px; }
    .notice-icon { font-size: 16px; flex-shrink: 0; }
    .notice-amber { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .notice-red   { background: #fff1f2; border-color: #fecdd3; color: #9f1239; }
    .notice-slate { background: #f8fafc; border-color: #e2e8f0; color: #475569; }

    /* ── Spinner ── */
    .spinner-wrap { display: flex; align-items: center; justify-content: center; height: 200px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--indigo); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Plan pills ── */
    .plan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .plan-pill { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px; }
    .plan-pill strong { display: block; font-size: 13px; margin-bottom: 2px; color: var(--text); }
    .plan-pill span { color: var(--muted); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/*
 * ─────────────────────────────────────────────────────────────────────────────
 * Design decisions (embedded per user request):
 *
 * Q1 — Isolation of QA work in a mixed-team ADO project:
 *   AMR-Systems hosts both Systems engineers and QA engineers.  User Stories are
 *   filtered by AssignedTo (qa_team_members in config.yaml) because the QA member
 *   is doing the testing work.  Bugs are filtered by CreatedBy because the QA
 *   member is the one who found and filed the defect — NOT AssignedTo, which points
 *   to the developer fixing it.  The sb_qa tag provides a tag-based override so
 *   ad-hoc items are captured without needing exact name matching.
 *
 * Q2 — Tier 2 test plan data from a different ADO project:
 *   Test Plans live in 'sootballs'; the same PAT works cross-project.  The suite-
 *   level testCaseCount API returns 0 for all plans (confirmed 2026-05-11) because
 *   test cases are linked at plan level, not as suite children.  WIQL on
 *   WorkItemType='Test Case' with AutomationStatus field is the correct path.
 *   The Test Plans tab shows aggregate counts with a migration-pending notice so
 *   management understands the data lives in a separate project today.
 *
 * Q3 — Visual hierarchy for 5-min stand-up vs. full sprint review:
 *   Overview first: gauge + KPI cards → 30-second read for stand-up.
 *   Trends second: multi-sprint line chart → context for sprint review.
 *   Bugs + Engineers last: drill-down for root-cause analysis.
 * ─────────────────────────────────────────────────────────────────────────────
 */

const { useState, useEffect, useRef, useCallback } = React;

// ── API helpers ──────────────────────────────────────────────────────────────

function useFetch(url, deps = []) {
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState(null);
  const refreshRef             = useRef(0);

  const refresh = useCallback(() => { refreshRef.current += 1; }, []);
  // Expose a state value so consumers can trigger re-render on refresh
  const [refreshTick, setRefreshTick] = useState(0);
  const triggerRefresh = useCallback(() => {
    refreshRef.current += 1;
    setRefreshTick(t => t + 1);
  }, []);

  useEffect(() => {
    if (!url) return;
    let cancelled = false;
    setLoading(true);
    setError(null);
    fetch(url)
      .then(r => {
        if (!r.ok) throw new Error(`Server returned ${r.status}`);
        return r.json();
      })
      .then(d => { if (!cancelled) { setData(d); setLoading(false); } })
      .catch(e => { if (!cancelled) { setError(e.message); setLoading(false); } });
    return () => { cancelled = true; };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [url, refreshTick, ...deps]);

  return { data, loading, error, refresh: triggerRefresh };
}

// ── ECharts wrapper ──────────────────────────────────────────────────────────
// Uses a ref to track the last-serialized option so setOption is only called
// when the data actually changes — avoids the cost of passing JSON.stringify
// as a useEffect dependency on every render.

function EChart({ option, height = 300 }) {
  const divRef      = useRef(null);
  const chartRef    = useRef(null);
  const prevJsonRef = useRef(null);

  // Init chart once on mount; dispose on unmount
  useEffect(() => {
    const chart = echarts.init(divRef.current);
    chartRef.current = chart;
    return () => { chart.dispose(); chartRef.current = null; };
  }, []);

  // Resize when container size changes
  useEffect(() => {
    const obs = new ResizeObserver(() => chartRef.current?.resize());
    if (divRef.current) obs.observe(divRef.current);
    return () => obs.disconnect();
  }, []);

  // Apply option only when it differs from the last render
  useEffect(() => {
    if (!chartRef.current) return;
    const json = JSON.stringify(option);
    if (json !== prevJsonRef.current) {
      chartRef.current.setOption(option, true);
      prevJsonRef.current = json;
    }
  });

  return <div ref={divRef} style={{ height }} role="img" aria-label="chart" />;
}

// ── KPI Card ─────────────────────────────────────────────────────────────────

function KPICard({ label, value, unit = '', trend, lowerBetter = false, sub }) {
  let valClass = '';
  if (value !== null && value !== undefined) {
    const n = Number(value);
    if (!isNaN(n)) {
      if (lowerBetter) valClass = n <= 15 ? 'green' : n <= 30 ? 'amber' : 'red';
      else             valClass = n >= 75 ? 'green' : n >= 50 ? 'amber' : 'red';
    }
  }

  let trendEl = null;
  if (trend !== undefined && trend !== null) {
    const better = lowerBetter ? trend < 0 : trend > 0;
    const color  = better ? 'var(--emerald)' : trend === 0 ? '#94a3b8' : 'var(--rose)';
    trendEl = (
      <div className="kpi-trend" style={{ color }} aria-label={`trend ${trend > 0 ? 'up' : trend < 0 ? 'down' : 'flat'}`}>
        {trend > 0 ? '▲' : trend < 0 ? '▼' : '—'} {Math.abs(trend)}{unit} vs prev
      </div>
    );
  }

  return (
    <div className="kpi-card" role="region" aria-label={label}>
      <div className="kpi-label">{label}</div>
      <div className={`kpi-value ${valClass}`}>
        {value !== null && value !== undefined ? `${value}${unit}` : '—'}
      </div>
      {trendEl}
      {sub && <div className="kpi-sub">{sub}</div>}
    </div>
  );
}

// ── Shared utilities ──────────────────────────────────────────────────────────

function Spinner() {
  return <div className="spinner-wrap" role="status" aria-label="Loading"><div className="spinner" /></div>;
}

function ErrorNotice({ message }) {
  return (
    <div className="page">
      <div className="notice notice-red">
        <span className="notice-icon">✕</span>
        <div>
          <strong>Failed to load data.</strong> {message}<br />
          <span style={{ fontSize: 12 }}>Check that the server is running and ADO_PAT is set correctly.</span>
        </div>
      </div>
    </div>
  );
}

function delta(curr, prev, key) {
  if (!curr || !prev) return null;
  return Math.round((curr[key] - prev[key]) * 10) / 10;
}

function colorClass(val, lowerBetter = false) {
  if (val === null || val === undefined) return 'td-muted';
  const n = Number(val);
  if (isNaN(n)) return '';
  if (lowerBetter) return n <= 15 ? 'td-good' : n <= 30 ? 'td-warn' : 'td-bad';
  return n >= 75 ? 'td-good' : n >= 50 ? 'td-warn' : 'td-bad';
}

// ── Overview Page ─────────────────────────────────────────────────────────────

const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatIsoDateShort(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${MONTH_ABBR[parseInt(m, 10) - 1]} ${parseInt(d, 10)}`;
}

function OverviewPage({ sprintLabel, onCacheRefreshed }) {
  const { data: kpi, loading, error, refresh } = useFetch(
    sprintLabel ? `/api/kpi/summary?sprint=${encodeURIComponent(sprintLabel)}` : null
  );
  const { data: trends } = useFetch('/api/kpi/trends');
  const { data: ciStability } = useFetch('/api/ci_stability');

  // Expose refresh handle so parent can trigger after cache clear
  useEffect(() => {
    if (onCacheRefreshed) onCacheRefreshed(() => refresh());
  }, [onCacheRefreshed, refresh]);

  const prevKpi = trends && kpi
    ? (() => {
        const idx = trends.findIndex(t => t.sprint === kpi.sprint);
        return idx > 0 ? trends[idx - 1] : null;
      })()
    : null;

  const last3 = trends ? trends.slice(-3) : [];

  if (loading) return <Spinner />;
  if (error) return <ErrorNotice message={error} />;
  if (!kpi) return null;

  const stateDonutData = Object.entries(kpi.state_breakdown || {}).map(([name, value]) => ({
    name, value,
    itemStyle: {
      color: name === 'Completed' ? '#10b981' : name === 'In Progress' ? '#6366f1' :
             name === 'New' ? '#94a3b8' : name === 'Deferred' ? '#f59e0b' :
             name === 'QA Testing' ? '#8b5cf6' : '#f43f5e',
    },
  }));

  const ciSuiteLabel = (w) => {
    if (!w || w.status !== 'ok') return '—';
    const dateNote = w.is_stale ? ` (${formatIsoDateShort(w.date)})` : '';
    return `${w.pass_pct}%${dateNote}`;
  };
  const ciSub = ciStability
    ? `Integration ${ciSuiteLabel(ciStability.workflows?.integration)} · E2E ${ciSuiteLabel(ciStability.workflows?.e2e)}`
    : 'Nightly integration + e2e, latest run';

  return (
    <div className="page">
      <div className="section-title">Sprint Health Indicators</div>
      <div className="kpi-grid">
        <KPICard label="Completion Rate" value={kpi.completion_rate} unit="%" trend={delta(kpi, prevKpi, 'completion_rate')} sub={`${kpi.completed_user_stories} / ${kpi.total_user_stories} stories`} />
        <KPICard label="Bug Count" value={kpi.bug_count} trend={prevKpi ? kpi.bug_count - prevKpi.bug_count : null} lowerBetter sub={`${kpi.resolved_bugs} resolved`} />
        <KPICard label="Bug Resolution" value={kpi.bug_resolution_rate} unit="%" trend={delta(kpi, prevKpi, 'bug_resolution_rate')} sub={`${kpi.resolved_bugs} of ${kpi.bug_count}`} />
        <KPICard label="Unplanned Work" value={kpi.unplanned_rate} unit="%" trend={delta(kpi, prevKpi, 'unplanned_rate')} lowerBetter sub={`${kpi.unplanned_count} stories added mid-sprint`} />
        <KPICard label="Carry-Over Rate" value={kpi.carry_over_rate} unit="%" trend={delta(kpi, prevKpi, 'carry_over_rate')} lowerBetter sub={`${kpi.carry_over_count} stories from prior sprint`} />
        <KPICard label="Defect Density" value={kpi.defect_density} trend={delta(kpi, prevKpi, 'defect_density')} lowerBetter sub="bugs per user story" />
        <KPICard label="CI Stability %" value={ciStability?.combined_pass_pct ?? null} unit="%" sub={ciSub} />
      </div>

      <div className="chart-row chart-row-2">
        <div className="chart-card" style={kpi.bug_count > 0 ? undefined : { gridColumn: '1 / -1' }}>
          <div className="chart-card-title">User Story State Distribution</div>
          <EChart height={220} option={{
            tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
            legend: { orient: 'vertical', right: 10, top: 'center', textStyle: { fontSize: 12 } },
            series: [{ type: 'pie', radius: ['45%', '70%'], center: ['35%', '50%'], label: { show: false }, data: stateDonutData }],
          }} />
        </div>

        {kpi.bug_count > 0 && (
          <div className="chart-card">
            <div className="chart-card-title">Velocity — Story Count</div>
            <EChart height={220} option={{
              tooltip: { trigger: 'axis' },
              xAxis: { type: 'category', data: ['Completed', 'In Progress', 'Carry-Over', 'Unplanned'], axisLabel: { fontSize: 11 } },
              yAxis: { type: 'value', minInterval: 1 },
              grid: { left: 40, right: 16, top: 16, bottom: 36 },
              series: [{
                type: 'bar', barMaxWidth: 48,
                data: [
                  { value: kpi.completed_user_stories, itemStyle: { color: '#10b981' } },
                  { value: kpi.wip_count,              itemStyle: { color: '#6366f1' } },
                  { value: kpi.carry_over_count,       itemStyle: { color: '#f59e0b' } },
                  { value: kpi.unplanned_count,        itemStyle: { color: '#f43f5e' } },
                ],
                label: { show: true, position: 'top', fontSize: 11 },
              }],
            }} />
          </div>
        )}
      </div>

      {last3.length > 1 && (
        <>
          <div className="section-title">Sprint Comparison (last {last3.length})</div>
          <div className="chart-card">
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Metric</th>
                    {last3.map(s => <th key={s.sprint}>{s.sprint}{s.sprint === kpi.sprint ? ' ★' : ''}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {[
                    ['Completion Rate',  'completion_rate',    '%', false],
                    ['Bug Count',        'bug_count',          '',  true],
                    ['Bug Resolution',   'bug_resolution_rate','%', false],
                    ['Unplanned Rate',   'unplanned_rate',     '%', true],
                    ['Carry-Over Rate',  'carry_over_rate',    '%', true],
                    ['Defect Density',   'defect_density',     '',  true],
                    ['MTTR (days)',      'mttr_days',          '',  true],
                  ].map(([label, key, unit, lb]) => (
                    <tr key={key}>
                      <td style={{ fontWeight: 500 }}>{label}</td>
                      {last3.map(s => (
                        <td key={s.sprint} className={colorClass(s[key], lb)}>
                          {s[key] !== null && s[key] !== undefined ? `${s[key]}${unit}` : '—'}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

// ── Trends Page ───────────────────────────────────────────────────────────────

function TrendsPage() {
  const { data: trends, loading, error } = useFetch('/api/kpi/trends');
  if (loading) return <Spinner />;
  if (error) return <ErrorNotice message={error} />;
  if (!trends || trends.length === 0) return <div className="page"><p>No trend data yet.</p></div>;

  const labels = trends.map(t => t.sprint);

  const mkSeries = (name, key, color, yIndex = 0, dashed = false) => ({
    name, type: 'line', smooth: true, symbol: 'circle', symbolSize: 6,
    data: trends.map(t => t[key]),
    yAxisIndex: yIndex,
    lineStyle: { width: 2, color, type: dashed ? 'dashed' : 'solid' },
    itemStyle: { color },
  });

  const trendOption = {
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
    legend: { bottom: 0, textStyle: { fontSize: 11 } },
    grid: { left: 50, right: 24, top: 24, bottom: 80 },
    xAxis: { type: 'category', data: labels, axisLabel: { fontSize: 11, rotate: 30 } },
    yAxis: [
      { type: 'value', name: '%', nameTextStyle: { fontSize: 10 }, axisLabel: { formatter: '{value}%', fontSize: 10 }, min: 0, max: 100 },
      { type: 'value', name: 'Count', nameTextStyle: { fontSize: 10 }, axisLabel: { fontSize: 10 } },
    ],
    series: [
      mkSeries('Completion Rate %',  'completion_rate',    '#6366f1'),
      mkSeries('Bug Resolution %',   'bug_resolution_rate','#10b981'),
      mkSeries('Unplanned Rate %',   'unplanned_rate',     '#f59e0b'),
      mkSeries('Carry-Over Rate %',  'carry_over_rate',    '#f43f5e'),
      mkSeries('Bug Count',          'bug_count',          '#94a3b8', 1, true),
      mkSeries('Defect Density',     'defect_density',     '#0ea5e9', 1, true),
    ],
  };

  return (
    <div className="page">
      <div className="section-title">KPI Trends Across Sprints</div>
      <div className="chart-card" style={{ marginBottom: 24 }}>
        <div className="chart-card-title">Sprint-over-Sprint KPI Trends</div>
        <EChart option={trendOption} height={360} />
        <div style={{ fontSize: 11, color: 'var(--muted)', marginTop: 8 }}>
          Solid lines: percentage metrics (left axis) · Dashed lines: count metrics (right axis)
        </div>
      </div>
      <div className="chart-card">
        <div className="section-title" style={{ marginBottom: 12 }}>Sprint Summary Table</div>
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Sprint</th><th>Stories</th><th>Done %</th><th>Bugs</th><th>Bug Res %</th></tr>
            </thead>
            <tbody>
              {trends.map(t => (
                <tr key={t.sprint}>
                  <td style={{ fontWeight: 500, whiteSpace: 'nowrap' }}>{t.sprint}</td>
                  <td>{t.total_user_stories}</td>
                  <td className={colorClass(t.completion_rate)}>{t.completion_rate}%</td>
                  <td>{t.bug_count}</td>
                  <td className={colorClass(t.bug_resolution_rate)}>{t.bug_resolution_rate}%</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Bugs Page ─────────────────────────────────────────────────────────────────

function BugsPage({ sprintLabel }) {
  const { data: bugs, loading, error } = useFetch(
    sprintLabel ? `/api/bugs?sprint=${encodeURIComponent(sprintLabel)}` : null
  );
  if (loading) return <Spinner />;
  if (error) return <ErrorNotice message={error} />;
  if (!bugs) return null;

  const stateColors = {
    Assigned: '#06b6d4', Blocked: '#8b5cf6', Closed: '#65a30d', Completed: '#65a30d',
    Duplicate: '#ec4899', 'In Progress': '#f97316', 'In Review': '#10b981',
    'Not a Bug': '#92400e', Postponed: '#0d9488', 'Ready To Test': '#6366f1',
    Reported: '#a21caf', 'Waiting for Release': '#f43f5e',
  };

  const stateOption = {
    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
    legend: { orient: 'vertical', right: 10, top: 'center', textStyle: { fontSize: 11 } },
    series: [{
      type: 'pie', radius: ['42%', '68%'], center: ['38%', '50%'],
      label: { show: false },
      data: Object.entries(bugs.state_distribution || {}).map(([name, value]) => ({
        name, value, itemStyle: { color: stateColors[name] || '#64748b' },
      })),
    }],
  };

  const trend = bugs.weekly_trend || [];
  const trendOption = {
    tooltip: { trigger: 'axis' },
    legend: { bottom: 0, textStyle: { fontSize: 11 } },
    grid: { left: 44, right: 44, top: 20, bottom: 40 },
    xAxis: { type: 'category', data: trend.map(t => t.week), axisLabel: { fontSize: 10 } },
    yAxis: [
      { type: 'value', name: 'bugs / week', minInterval: 1, axisLabel: { fontSize: 10 } },
      { type: 'value', name: 'cumulative net flow', axisLabel: { fontSize: 10 }, splitLine: { show: false } },
    ],
    series: [
      { name: 'Created', type: 'bar', barMaxWidth: 22, itemStyle: { color: '#f43f5e' }, data: trend.map(t => t.created) },
      { name: 'Resolved', type: 'bar', barMaxWidth: 22, itemStyle: { color: '#10b981' }, data: trend.map(t => t.resolved) },
      { name: 'Cumulative net flow', type: 'line', yAxisIndex: 1, symbol: 'circle', symbolSize: 6, itemStyle: { color: '#6366f1' }, lineStyle: { color: '#6366f1' }, data: trend.map(t => t.cumulative_net_flow) },
    ],
  };

  const ageOrder = ['0-7d', '8-14d', '15-30d', '31d+'];
  const ageColors = { '0-7d': '#10b981', '8-14d': '#f59e0b', '15-30d': '#fb923c', '31d+': '#f43f5e' };
  const ageBuckets = bugs.age_buckets || {};
  const ageOption = {
    tooltip: { trigger: 'axis' },
    grid: { left: 40, right: 16, top: 16, bottom: 30 },
    xAxis: { type: 'category', data: ageOrder, axisLabel: { fontSize: 11 } },
    yAxis: { type: 'value', minInterval: 1 },
    series: [{
      type: 'bar', barMaxWidth: 48, label: { show: true, position: 'top', fontSize: 11 },
      data: ageOrder.map(k => ({ value: ageBuckets[k] || 0, itemStyle: { color: ageColors[k] } })),
    }],
  };

  const byArea = bugs.by_area || [];
  const areaOption = {
    tooltip: { trigger: 'axis' },
    legend: { bottom: 0, textStyle: { fontSize: 11 } },
    grid: { left: 130, right: 40, top: 12, bottom: 44 },
    xAxis: { type: 'value', minInterval: 1, axisLabel: { fontSize: 10 } },
    yAxis: { type: 'category', data: byArea.map(a => a.area), axisLabel: { fontSize: 11 } },
    series: [
      { name: 'Open', type: 'bar', stack: 'a', barMaxWidth: 20, itemStyle: { color: '#f43f5e' }, data: byArea.map(a => a.open) },
      { name: 'Resolved', type: 'bar', stack: 'a', barMaxWidth: 20, itemStyle: { color: '#10b981' }, data: byArea.map(a => a.total - a.open) },
    ],
  };

  const bugStateStyle = (state) => {
    const done = state === 'Closed' || state === 'Completed';
    return {
      background: done ? '#d1fae5' : state === 'Reported' ? '#f1f5f9' : '#fef3c7',
      color: done ? '#065f46' : '#92400e',
      padding: '2px 8px', borderRadius: 99, fontSize: 11, fontWeight: 600,
    };
  };

  const ttr = bugs.lead_time?.time_to_resolve || {};
  const ttv = bugs.lead_time?.time_to_verify || {};
  const openBacklog = ageOrder.reduce((sum, k) => sum + (ageBuckets[k] || 0), 0);

  return (
    <div className="page">
      <div className="kpi-grid" style={{ gridTemplateColumns: 'repeat(auto-fill,minmax(160px,1fr))' }}>
        <KPICard label="Total Bugs (sprint)" value={bugs.total} />
        <KPICard label="Resolved (sprint)" value={bugs.resolved} sub={bugs.total ? `${Math.round(bugs.resolved / bugs.total * 100)}%` : '0%'} />
        <KPICard label="Open Backlog (PI)" value={openBacklog} lowerBetter sub={`of ${bugs.pi_total} in ${bugs.pi}`} />
        <KPICard label="Time to Resolve" value={ttr.median} unit=" d" lowerBetter sub={ttr.count ? `median · P90 ${ttr.p90}d · n=${ttr.count}` : 'no data'} />
        <KPICard label="Time to Verify" value={ttv.median} unit=" d" lowerBetter sub={ttv.count ? `resolved→closed · P90 ${ttv.p90}d` : 'no data'} />
      </div>

      <div className="chart-row chart-row-2">
        <div className="chart-card" style={{ gridColumn: '1 / -1' }}>
          <div className="chart-card-title">Bugs Created vs. Resolved — Weekly ({bugs.pi})</div>
          <EChart option={trendOption} height={260} />
        </div>
      </div>

      <div className="chart-row chart-row-2">
        <div className="chart-card">
          <div className="chart-card-title">Bug State Distribution (sprint)</div>
          <EChart option={stateOption} height={240} />
        </div>
        <div className="chart-card">
          <div className="chart-card-title">Open Bug Age (PI, currently open)</div>
          <EChart option={ageOption} height={240} />
        </div>
      </div>

      {byArea.length > 0 && (
        <div className="chart-card">
          <div className="chart-card-title">Bugs by Area (PI)</div>
          <EChart option={areaOption} height={Math.max(160, byArea.length * 36)} />
        </div>
      )}

      {bugs.oldest_open && bugs.oldest_open.length > 0 && (
        <div className="chart-card">
          <div className="chart-card-title">Oldest Open Bugs (aging spotlight)</div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>Title</th><th>State</th><th>Area</th><th>Created</th><th>Age (days)</th></tr>
              </thead>
              <tbody>
                {bugs.oldest_open.map(b => (
                  <tr key={b.id}>
                    <td className="td-muted">{b.id}</td>
                    <td style={{ maxWidth: 300 }}>{b.title}</td>
                    <td><span style={bugStateStyle(b.state)}>{b.state}</span></td>
                    <td className="td-muted">{b.area || '—'}</td>
                    <td className="td-muted">{b.created}</td>
                    <td className={b.age_days > 30 ? 'red' : b.age_days > 14 ? 'amber' : ''}>{b.age_days}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {bugs.items && bugs.items.length > 0 && (
        <div className="chart-card">
          <div className="chart-card-title">Recent Bugs (sprint)</div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>Title</th><th>State</th><th>Priority</th><th>Area</th><th>Created</th><th>Resolved</th><th>Closed</th></tr>
              </thead>
              <tbody>
                {bugs.items.slice(0, 30).map(b => (
                  <tr key={b.id}>
                    <td className="td-muted">{b.id}</td>
                    <td style={{ maxWidth: 300 }}>{b.title}</td>
                    <td><span style={bugStateStyle(b.state)}>{b.state}</span></td>
                    <td className="td-muted">{b.priority || '—'}</td>
                    <td className="td-muted">{b.area || '—'}</td>
                    <td className="td-muted">{b.created || '—'}</td>
                    <td className="td-muted">{b.resolved || '—'}</td>
                    <td className="td-muted">{b.closed || '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

            <thead>
              <tr><th>Engineer</th><th>Stories</th><th>Completed</th><th>Completion %</th><th>Story Points</th></tr>

                <tr key={e.name}>

                  <td>{e.completed}</td>

// ── Feature Coverage Page ─────────────────────────────────────────────────────

function FeatureCoveragePage({ sprintLabel }) {
  const url = '/api/feature_coverage' + (sprintLabel ? `?sprint=${encodeURIComponent(sprintLabel)}` : '');
  const { data, loading, error } = useFetch(url);
  const url2 = '/api/engineer_automation';
  const { data: engData } = useFetch(url2);
  const { data: sanity, loading: sanityLoading } = useFetch('/api/release_feature_coverage');

  if (loading) return <Spinner />;
  if (error)   return <ErrorNotice message={error} />;
  if (!data)   return null;

  const s = data.summary;
  const coverageColor = s.overall_coverage_pct >= 70 ? '#10b981'
                       : s.overall_coverage_pct >= 30 ? '#f59e0b' : '#f43f5e';

  const RELEASE_ORDER = ['3.4', '3.5', '3.6', '3.7'];
  const releaseCards = sanity && sanity.status === 'ok'
    ? RELEASE_ORDER.filter(r => sanity.releases[r]).map(r => ({ release: r, ...sanity.releases[r] }))
    : [];
  const allSanityFeatures = releaseCards.flatMap(r => r.features);
  const statusStyle = (label) => {
    if (label === 'Automated') return { background: '#dcfce7', color: '#10b981' };
    if (label === 'Partial')   return { background: '#fef3c7', color: '#b45309' };
    if (label === 'Doc Mismatch') return { background: '#e2e8f0', color: '#475569' };
    return { background: '#fee2e2', color: '#dc2626' }; // Gap, Held, Scaffolded
  };

  return (
    <div className="page">
      <div className="section-title">
        Release Sanity Coverage (3.4 – 3.7)
        <span className="badge badge-tier2" style={{ marginLeft: 8 }}>
          AMR Master Sanity · {sanity && sanity.status === 'ok' ? sanity.total : '…'} TC-SAN cases
        </span>
      </div>
      {sanityLoading ? <Spinner /> : sanity && sanity.status === 'ok' ? (
        <>
          <div className="kpi-grid" style={{ gridTemplateColumns: 'repeat(auto-fill,minmax(210px,1fr))' }}>
            {releaseCards.map(r => (
              <KPICard
                key={r.release}
                label={`Release ${r.release}`}
                value={r.automation_pct} unit="%"
                sub={`${r.automated} automated + ${r.partial} partial + ${r.gap} gap${r.doc_mismatch ? ` + ${r.doc_mismatch} doc-mismatch` : ''} of ${r.total} (${r.automated_or_partial_pct}% has some automation)`}
              />
            ))}
          </div>
          <div className="table-wrap" style={{ marginTop: 16 }}>
            <table>
              <thead>
                <tr><th>TC-SAN</th><th>Release</th><th>Feature</th><th>Ref</th><th>Status</th></tr>
              </thead>
              <tbody>
                {allSanityFeatures.map(f => (
                  <tr key={f.tc_id}>
                    <td className="td-muted">{f.tc_id}</td>
                    <td>{f.release}</td>
                    <td style={{ maxWidth: 380 }}>{f.title}</td>
                    <td className="td-muted">{f.proj_ref}</td>
                    <td>
                      <span className="badge" style={{ ...statusStyle(f.status_label), fontSize: 11 }} title={f.note || ''}>
                        {f.status_label}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      ) : (
        <div className="notice notice-slate">
          <span className="notice-icon">ℹ</span>
          <div>Release sanity coverage unavailable: <code>{sanity ? sanity.status : 'loading'}</code>. Needs amr_master_sanity_file configured and gen_amr_master_sanity_suite_v2.py run at least once.</div>
        </div>
      )}

      <div className="section-title" style={{ marginTop: 32 }}>
        Feature Coverage — Automation Traceability
        <span className="badge badge-tier2" style={{ marginLeft: 8 }}>
          Feature → TC → Automated
        </span>
      </div>

      {/* Summary KPI row */}
      <div className="kpi-grid">
        <div className="kpi-card">
          <div className="kpi-value" style={{ color: coverageColor }}>
            {s.overall_coverage_pct}%
          </div>
          <div className="kpi-label">Overall TC Coverage</div>
          <div className="kpi-sub">{s.automated_tcs} / {s.total_tcs} TCs automated</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-value" style={{ color: '#10b981' }}>{s.fully_covered}</div>
          <div className="kpi-label">Fully Covered</div>
          <div className="kpi-sub">100% TCs automated</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-value" style={{ color: '#f59e0b' }}>{s.partially_covered}</div>
          <div className="kpi-label">Partially Covered</div>
          <div className="kpi-sub">Some TCs missing</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-value" style={{ color: '#94a3b8' }}>{s.no_tcs_linked}</div>
          <div className="kpi-label">No TCs Linked</div>
          <div className="kpi-sub">Need Tested By relation</div>
        </div>
      </div>

      {/* Per-Feature table */}
      <div className="section-title" style={{ marginTop: 24 }}>Per-Feature Breakdown</div>
      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Feature / Story</th><th>Assignee</th><th>State</th>
              <th style={{ textAlign: 'right' }}>Total TCs</th>
              <th style={{ textAlign: 'right' }}>Automated</th>
              <th style={{ textAlign: 'right' }}>Coverage</th>
              <th>Progress</th>
            </tr>
          </thead>
          <tbody>
            {(data.items || []).map(f => {
              const pct = f.coverage_pct;
              const barColor = pct === 100 ? '#10b981' : pct > 0 ? '#f59e0b' : '#e2e8f0';
              const textColor = pct === 100 ? '#10b981' : pct > 0 ? '#f59e0b' : '#94a3b8';
              return (
                <tr key={f.id}>
                  <td>
                    <a
                      href={`https://dev.azure.com/rapyuta-robotics/AMR/_workitems/edit/${f.id}`}
                      target="_blank" rel="noreferrer"
                      style={{ color: 'var(--indigo)', textDecoration: 'none' }}
                    >
                      {f.id}
                    </a>
                  </td>
                  <td style={{ maxWidth: 320, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {f.title}
                  </td>
                  <td>{(f.assignee || '—').split(' ')[0]}</td>
                  <td><span className="badge" style={{ background: '#e2e8f0', color: '#475569', fontSize: 11 }}>{f.state}</span></td>
                  <td style={{ textAlign: 'right' }}>{f.total_tcs || '—'}</td>
                  <td style={{ textAlign: 'right' }}>{f.total_tcs ? f.automated_tcs : '—'}</td>
                  <td style={{ textAlign: 'right', fontWeight: 600, color: textColor }}>
                    {f.total_tcs ? `${pct}%` : 'No TCs'}
                  </td>
                  <td style={{ width: 120 }}>
                    {f.total_tcs > 0 && (
                      <div style={{ background: '#e2e8f0', borderRadius: 4, height: 8, width: '100%' }}>
                        <div style={{ background: barColor, borderRadius: 4, height: 8, width: `${pct}%` }} />
                      </div>
                    )}
                  </td>
                </tr>
              );
            })}
            {(!data.items || data.items.length === 0) && (
              <tr><td colSpan={8} style={{ textAlign: 'center', color: '#94a3b8', padding: 24 }}>
                No Features found for this sprint. Add <code>qa_team_members</code> to config.yaml
                and ensure Features are tagged or assigned to QA members.
              </td></tr>
            )}
          </tbody>
        </table>
      </div>

      {/* Engineer automation attribution */}
      {engData && engData.engineers && engData.engineers.length > 0 && (
        <>
          <div className="section-title" style={{ marginTop: 32 }}>
            Automation Attribution — by Engineer
            <span className="badge badge-tier2" style={{ marginLeft: 8 }}>from github_pr in YAML</span>
          </div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Engineer (GitHub)</th>
                  <th style={{ textAlign: 'right' }}>TCs Automated</th>
                  <th>PRs</th>
                </tr>
              </thead>
              <tbody>
                {engData.engineers.map(e => (
                  <tr key={e.engineer}>
                    <td>{e.engineer}</td>
                    <td style={{ textAlign: 'right', fontWeight: 600 }}>{e.tcs_automated}</td>
                    <td style={{ color: 'var(--muted)', fontSize: 12 }}>
                      {(e.prs || []).map(pr => `#${pr}`).join(', ') || '—'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{ marginTop: 8, fontSize: 12, color: '#94a3b8' }}>
            Attribution is based on the <code>github_pr</code> field in <code>ado_test_mapping.yaml</code>.
            Fill this field (auto-filled by CI on merge) to see complete attribution.
          </div>
        </>
      )}
    </div>
  );
}

// ── Automation Coverage Page ──────────────────────────────────────────────────

function AutomationPage() {
  const { data, loading, error } = useFetch('/api/automation_coverage');
  const { data: sbQa, loading: sbQaLoading } = useFetch('/api/sb_qa_coverage');

  if (loading) return <Spinner />;
  if (error)   return <ErrorNotice message={error} />;
  if (!data)   return null;

  const s = data.summary;
  const pctColor = s.pct_automated_in_ado >= 50 ? '#10b981'
                 : s.pct_automated_in_ado >= 20 ? '#f59e0b' : '#f43f5e';

  const gaugeOption = {
    series: [{
      type: 'gauge', startAngle: 200, endAngle: -20, min: 0, max: 100,
      radius: '90%', pointer: { show: false },
      progress: { show: true, width: 20, itemStyle: { color: pctColor } },
      axisLine: { lineStyle: { width: 20, color: [[1, '#e2e8f0']] } },
      axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
      detail: {
        valueAnimation: true, fontSize: 36, fontWeight: 700, color: pctColor,
        formatter: '{value}%', offsetCenter: [0, '10%'],
      },
      title: { fontSize: 13, color: '#64748b', offsetCenter: [0, '38%'] },
      data: [{ value: s.pct_automated_in_ado, name: 'Automated' }],
    }],
  };

  const wiStateEntries = Object.entries(s.amr_wi_state_breakdown || {});
  const wiStateOption = wiStateEntries.length ? {
    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
    legend: { orient: 'vertical', right: 10, top: 'center', textStyle: { fontSize: 12 } },
    series: [{
      type: 'pie', radius: ['45%', '70%'], center: ['35%', '50%'],
      label: { show: false },
      data: wiStateEntries.map(([name, value]) => ({
        name, value,
        itemStyle: {
          color: ['Closed','Done','Completed'].includes(name) ? '#10b981'
               : name === 'Active' ? '#6366f1'
               : name === 'In Progress' ? '#8b5cf6'
               : name === 'New' ? '#94a3b8' : '#f59e0b',
        },
      })),
    }],
  } : null;

  return (
    <div className="page">
      <div className="section-title">Automation Coverage — sootballs\qa Test Cases</div>

      <div className="kpi-grid">
        <KPICard label="Automation Rate (raw TCs)" value={s.pct_automated_in_ado} unit="%"
          sub={`${s.automated_in_ado} of ${s.total_tcs_in_ado} TCs in ADO (sootballs\\qa)`} />
        <KPICard label="Automation Rate (distinct scenarios)" value={s.distinct_scenario_automation_rate} unit="%"
          sub={`${s.distinct_scenarios_automated} of ${s.distinct_scenarios} scenarios, parametrized variants de-duplicated`} />
        <KPICard label="Automated TCs" value={s.automated_in_ado}
          sub="AutomationStatus = Automated" />
        <KPICard label="Confirmed in Mapping" value={s.confirmed_in_mapping}
          sub={`${s.todo_in_mapping} TODO entries need tc_id lookup`} />
        <KPICard label="Pending ADO Apply" value={s.pending_link_to_ado} lowerBetter
          sub="confirmed in YAML · not yet run --apply" />
        <KPICard label="AMR WIs (sb_qa)" value={s.amr_wis_total}
          sub={`${s.amr_wis_with_linked_tcs} linked to confirmed TCs`} />
      </div>

      <div className="chart-row chart-row-2">
        <div className="chart-card">
          <div className="chart-card-title">
            Automation Rate <span className="badge badge-tier2">Live ADO · sootballs</span>
          </div>
          <EChart option={gaugeOption} height={230} />
          <div style={{ textAlign:'center', fontSize:12, color:'var(--muted)', marginTop:6 }}>
            {s.confirmed_in_mapping} functions confirmed in mapping ·&nbsp;
            {s.todo_in_mapping} TODO (tc_id pending)
          </div>
        </div>
        {wiStateOption ? (
          <div className="chart-card">
            <div className="chart-card-title">
              AMR WI State Breakdown <span className="badge badge-tier2">sb_qa tag · AMR project</span>
            </div>
            <EChart option={wiStateOption} height={230} />
          </div>
        ) : (
          <div className="chart-card">
            <div className="chart-card-title">AMR WI State Breakdown</div>
            <div style={{ padding:'40px 0', textAlign:'center', color:'var(--muted)', fontSize:13 }}>
              No AMR Work Items tagged <code>sb_qa</code> found.
            </div>
          </div>
        )}
      </div>

      {data.by_plan.length > 0 && (
        <>
          <div className="section-title" style={{ marginTop:4 }}>Per-Plan Automation Progress</div>
          <div className="chart-card" style={{ marginBottom:24 }}>
            {data.by_plan.map(p => {
              const pct = p.confirmed_tcs > 0
                ? Math.round(p.automated_in_ado / p.confirmed_tcs * 100) : 0;
              const barColor = pct === 100 ? 'var(--emerald)'
                             : pct >= 50 ? 'var(--amber)' : 'var(--rose)';
              return (
                <div key={p.plan_id} style={{ marginBottom:18 }}>
                  <div style={{ display:'flex', justifyContent:'space-between', marginBottom:5, fontSize:13 }}>
                    <span style={{ fontWeight:500 }}>
                      {p.plan_name}
                      <a href={`https://dev.azure.com/rapyuta-robotics/sootballs/_testManagement/define?planId=${p.plan_id}`}
                        target="_blank" rel="noreferrer"
                        style={{ marginLeft:6, fontSize:11, color:'var(--indigo)', textDecoration:'none' }}>
                        ↗
                      </a>
                    </span>
                    <span style={{ color:'var(--muted)', fontSize:12 }}>
                      {p.automated_in_ado} / {p.confirmed_tcs} automated · {pct}%
                    </span>
                  </div>
                  <div style={{ height:8, background:'#e2e8f0', borderRadius:4, overflow:'hidden' }}>
                    <div style={{ height:'100%', width:`${pct}%`, background:barColor,
                                  borderRadius:4, transition:'width .5s' }} />
                  </div>
                  {p.pending_link > 0 && (
                    <div style={{ fontSize:11, color:'var(--amber)', marginTop:3 }}>
                      ⚠ {p.pending_link} TC{p.pending_link !== 1 ? 's' : ''} in YAML but
                      &nbsp;--apply not yet run
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}

      {data.amr_wis.length > 0 && (
        <>
          <div className="section-title">AMR Work Items — Automation Backlog (sb_qa tag)</div>
          <div className="chart-card" style={{ marginBottom:24 }}>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>WI #</th><th>Title</th><th>State</th>
                    <th>Assignee</th><th>Sprint</th>
                    <th>Linked TCs</th><th>All Automated</th>
                  </tr>
                </thead>
                <tbody>
                  {data.amr_wis.map(w => {
                    const done = ['Closed','Done','Completed'].includes(w.state);
                    const stCls = done ? 'td-good'
                                : ['Active','In Progress'].includes(w.state) ? 'td-warn'
                                : 'td-muted';
                    const sprint = w.iteration ? w.iteration.split('\\').pop() : '—';
                    return (
                      <tr key={w.id}>
                        <td>
                          <a href={`https://dev.azure.com/rapyuta-robotics/AMR/_workitems/edit/${w.id}`}
                             target="_blank" rel="noreferrer"
                             style={{ color:'var(--indigo)', textDecoration:'none', fontWeight:600 }}>
                            {w.id}
                          </a>
                        </td>
                        <td style={{ maxWidth:300 }}>{w.title}</td>
                        <td className={stCls}>{w.state}</td>
                        <td className="td-muted">{w.assignee || '—'}</td>
                        <td className="td-muted">{sprint}</td>
                        <td>
                          {w.linked_count > 0
                            ? <span style={{ color:'var(--indigo)', fontWeight:600 }}>
                                {w.linked_count}
                              </span>
                            : <span className="td-muted">—</span>}
                        </td>
                        <td>
                          {w.linked_count === 0
                            ? <span className="td-muted">—</span>
                            : w.all_automated
                              ? <span className="td-good">✓ Yes</span>
                              : <span className="td-warn">⏳ Partial</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}

      {data.mapping_error && (
        <div className="notice notice-amber">
          <span className="notice-icon">⚠️</span>
          <div>
            <strong>Mapping file error.</strong> The file at <code>{data.mapping_file}</code> could
            not be loaded or has an unexpected schema. Check the server log for details.
          </div>
        </div>
      )}
      {!data.mapping_loaded && !data.mapping_error && (
        <div className="notice notice-amber">
          <span className="notice-icon">⚠️</span>
          <div>
            <strong>Mapping file not configured.</strong> Set <code>sootballs_mapping_file</code> in
            &nbsp;<code>config.yaml</code> (or <code>MAPPING_FILE</code> env var) to the path of
            &nbsp;<code>qa_tooling/ado_test_mapping.yaml</code> from the sootballs_tests repo.
            Per-plan progress bars and WI cross-linking require this file.
          </div>
        </div>
      )}

      <div className="section-title" style={{ marginTop:4 }}>sb_qa PR Coverage (GitHub)</div>
      {sbQaLoading ? <Spinner /> : sbQa && sbQa.status === 'ok' ? (
        <>
          <div className="kpi-grid">
            <KPICard label="sb_qa PRs" value={sbQa.total_sb_qa_prs}
              sub="new test automation / feature coverage PRs (GitHub label)" />
            <KPICard label="Linked to ADO" value={sbQa.link_rate_pct} unit="%"
              sub={`${sbQa.linked_count} of ${sbQa.total_sb_qa_prs} have an AB# link`} />
            <KPICard label="In Mapping File" value={sbQa.mapping_coverage_pct} unit="%" lowerBetter
              sub={`${sbQa.in_mapping_count} of ${sbQa.total_sb_qa_prs} tracked in ado_test_mapping.yaml`} />
          </div>
          {sbQa.missing_from_mapping.length > 0 && (
            <div className="chart-card" style={{ marginBottom:24 }}>
              <div className="chart-card-title">
                sb_qa PRs Missing from Mapping File
                <span className="badge badge-tier2">{sbQa.missing_from_mapping.length} to backfill</span>
              </div>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr><th>PR #</th><th>Title</th><th>Merged</th><th>ADO WI</th></tr>
                  </thead>
                  <tbody>
                    {sbQa.missing_from_mapping.slice(0, 30).map(p => (
                      <tr key={p.number}>
                        <td>
                          <a href={p.url} target="_blank" rel="noreferrer"
                             style={{ color:'var(--indigo)', textDecoration:'none', fontWeight:600 }}>
                            #{p.number}
                          </a>
                        </td>
                        <td style={{ maxWidth:340 }}>{p.title}</td>
                        <td className="td-muted">{p.merged_at || '—'}</td>
                        <td className="td-muted">
                          {p.ado_wi_ids.length > 0 ? p.ado_wi_ids.join(', ') : '—'}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </>
      ) : sbQa && sbQa.status !== 'ok' ? (
        <div className="notice notice-slate">
          <span className="notice-icon">ℹ</span>
          <div>sb_qa PR coverage unavailable: <code>{sbQa.status}</code>. Needs a snapshot built from <code>build_snapshot.py</code> on or after 2026-07-11 (labels weren't captured before that).</div>
        </div>
      ) : null}

      <div className="notice notice-slate" style={{ marginTop:16 }}>
        <span className="notice-icon">ℹ</span>
        <div>
          <strong>How this dashboard stays up-to-date automatically:</strong>
          <ol style={{ marginTop:6, paddingLeft:16, lineHeight:1.8, fontSize:12 }}>
            <li>QA engineer adds/confirms a mapping in <code>qa_tooling/ado_test_mapping.yaml</code></li>
            <li>PR merged to <code>devel</code> → GitHub Action <em>Link ADO Test Cases on merge</em> fires</li>
            <li>Action runs <code>link_ado_tests.py --apply --link-wis</code></li>
            <li>ADO TC flips to <strong>Automated</strong> · AMR WI gets cross-project link + comment</li>
            <li>Click ↺ above to refresh — numbers update immediately</li>
          </ol>
        </div>
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────

function App() {
  const [page, setPage]               = useState('overview');
  const [sprintLabel, setSprintLabel] = useState('');
  const [refreshing, setRefreshing]   = useState(false);
  const pageRefreshRef                = useRef(null);

  const { data: sprints } = useFetch('/api/sprints');
  const { data: healthData } = useFetch('/api/health');

  useEffect(() => {
    if (!sprints || sprintLabel) return;
    const cur = sprints.find(s => s.is_current)
      || sprints.filter(s => s.is_past).slice(-1)[0]
      || sprints[0];
    if (cur) setSprintLabel(cur.label);
  }, [sprints]);

  const handleRefresh = useCallback(() => {
    setRefreshing(true);
    fetch('/api/refresh', { method: 'POST' })
      .then(r => {
        if (!r.ok) throw new Error(`Cache refresh failed (${r.status})`);
        pageRefreshRef.current?.();
      })
      .catch(err => {
        // Log to console; avoid confusing data-refresh on a failed cache clear
        console.error('Cache refresh error:', err.message);
      })
      .finally(() => setRefreshing(false));
  }, []);

  const current = sprints?.find(s => s.label === sprintLabel);
  const qaCount = healthData?.qa_members_configured ?? 0;

  const tabs = [
    { id: 'overview',    label: '🏠 Overview'        },
    { id: 'trends',      label: '📈 Trends'           },
    { id: 'bugs',        label: '🐛 Bug Analytics'    },
    { id: 'engineers',   label: '👤 Per Engineer'     },
    { id: 'testplans',   label: '🧪 Test Plans'       },
    { id: 'automation',  label: '🤖 Automation'       },
    { id: 'features',    label: '🎯 Feature Coverage' },
  ];

  const pageEl = (() => {
    const key = `${page}-${sprintLabel}`;
    switch (page) {
      case 'overview':   return <OverviewPage key={key} sprintLabel={sprintLabel} onCacheRefreshed={fn => { pageRefreshRef.current = fn; }} />;
      case 'trends':     return <TrendsPage key={key} />;
      case 'bugs':       return <BugsPage key={key} sprintLabel={sprintLabel} />;
      case 'engineers':  return <EngineerPage key={key} sprintLabel={sprintLabel} />;
      case 'testplans':  return <TestPlansPage key={key} />;
      case 'automation': return <AutomationPage key={key} />;
      case 'features':   return <FeatureCoveragePage key={key} sprintLabel={sprintLabel} />;
      default:           return null;
    }
  })();

  return (
    <>
      <header className="hdr">
        <div className="hdr-logo">QA Metrics <span>Dashboard</span></div>
        <div className="hdr-spacer" />
        {qaCount > 0 && (
          <span className="member-badge">{qaCount} QA member{qaCount !== 1 ? 's' : ''} configured</span>
        )}
        {current?.is_current && <span className="current-badge">🟢 Active Sprint</span>}
        <select
          className="sprint-select"
          value={sprintLabel}
          onChange={e => setSprintLabel(e.target.value)}
          aria-label="Select sprint"
        >
          {(sprints || []).filter(s => !s.is_future).map(s => (
            <option key={s.label} value={s.label}>
              {s.label}{s.is_current ? ' (current)' : ''}
            </option>
          ))}
        </select>
        <button
          className="refresh-btn"
          title="Clear cache and refresh data"
          aria-label="Refresh data"
          disabled={refreshing}
          onClick={handleRefresh}
        >
          {refreshing ? '…' : '↺'}
        </button>
      </header>

      <nav className="nav" role="navigation" aria-label="Dashboard pages">
        {tabs.map(t => (
          <button
            key={t.id}
            className={`nav-tab${page === t.id ? ' active' : ''}`}
            onClick={() => setPage(t.id)}
            aria-current={page === t.id ? 'page' : undefined}
          >
            {t.label}
          </button>
        ))}
      </nav>

      {qaCount === 0 && (
        <div style={{ padding: '12px 24px' }}>
          <div className="notice notice-amber">
            <span className="notice-icon">⚠️</span>
            <div>
              No QA team members configured. Edit <code>config.yaml → qa_team_members</code> and add
              ADO display names of QA engineers. Items tagged <code>sb_qa</code> will still appear.
            </div>
          </div>
        </div>
      )}

      <main>{pageEl}</main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
