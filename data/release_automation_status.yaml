# Release-wise feature automation status — master table.
#
# Built by reconstructing each release's real feature content from git tag-range
# commit analysis (rr_sootballs, sootballs_wms_interface, rr_lbc and its UI/dependent
# repos), cross-referencing ADO Test Plans/Suites, looking up all related PRs
# (backend, UI, and any other dependent-repo PR — not just one) for each feature,
# and verifying real (non-skipped) test coverage against actual file content —
# with Slack search used to resolve any gaps git/ADO left open.
#
# Sub-release (patch) attribution: for every feature's related PR(s), found the
# real merge commit (including backport/cherry-pick commits, which get a new SHA
# but keep the PR number in the message), then walked each base release's patch
# tags in order and used `git merge-base --is-ancestor` to find the EARLIEST patch
# tag that contains it. For PRs in dependent repos (not rr_sootballs itself),
# resolved the exact dependent version pinned in rr_sootballs's docker/.env at
# each patch tag (WMS_TAG, ROBOT_UI_TAG, ORDERS_UI_MODULES_TAG, IO_AMR_BASE_TAG ->
# rr_io_amr submodule -> rr_lbc, LEGACY_UI_TAG -> rr_amr_ui) and checked ancestry
# against that pinned commit instead of the release tag directly.
#
# related_prs companion PRs (beyond the one that determined sub_release) were
# found by bounding the search to the exact commit delta that shipped in each
# dependent repo for that specific sub-release — i.e. the range between the
# previous sub-release's pin and this one's — rather than an unbounded keyword
# search across a repo's whole history, which produces false positives from
# unrelated work in other time periods.
#
# sub_release: null means no related PR exists to attribute a specific patch
# (kept at the release level).
#
# dependency_pins (below): the exact dependent-repo version pinned into each
# sub-release's docker/.env at build time — the ground truth this whole
# sub-release attribution is built on.
#
# status values:
#   automated            merged test PR with real, verified (mostly un-skipped) tests
#   written_not_merged    test PR exists but is still open / was closed unmerged
#   yet_to_automate       no test PR found; feature is a real automation gap
#   manually_verified     confirmed working via manual/Slack sign-off, no automated test
#   not_automatable       genuine hardware/simulation-limit only (e.g. physical scale, LED)
#   excluded              not actually a new distinct feature for this release
#   unverified            no conclusive evidence found either way
#
# suite_id: null means no ADO suite could be resolved for this feature (reported
# as such rather than fabricated — some test cases are orphaned / not suite-linked).

