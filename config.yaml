# Run this to discover what paths exist:
#   ADO_PAT=<pat> python3 qa_tooling/traverse_feature_coverage.py --discover-iteration-paths
#
# Then fill in each path → sprint label below.  Use the same sprint labels as
# defined in the sprints list above.  Paths use double-backslash in YAML.
#
# Example (fill with actual paths from the discovery command above):
#   "sootballs\\26PI1\\PI1 Sprint 1": "PI1 Sprint 1"
#   "sootballs\\26PI1\\PI1 Sprint 2": "PI1 Sprint 2"
