ado:
  organization: rapyuta-robotics
  project: AMR
  testplans_project: sootballs   # Test Plans live here until migration to AMR is approved

# Full display names exactly as shown in Azure DevOps (Settings → Users).
# User Stories are filtered by AssignedTo; Bugs are filtered by CreatedBy.
# Any item tagged with qa_tag is included regardless of assignee.
qa_team_members:
  - "Vasanthi Rajkumar"
  # Add remaining QA team members below:
  # - "First Last"

qa_tag: "sb_qa"   # Items with this ADO tag are always included

# Absolute path to qa_tooling/ado_test_mapping.yaml in the sootballs_tests repo.
# Used by /api/automation_coverage to join pytest ↔ ADO TC ↔ AMR WI data.
# Set to null to disable mapping-file enrichment (live ADO stats still shown).
# Override at runtime via the MAPPING_FILE environment variable.
# Example (set in a local config override, do not commit user-specific paths):
#   sootballs_mapping_file: "/home/youruser/path/to/sootballs_tests/qa_tooling/ado_test_mapping.yaml"
sootballs_mapping_file: null

# Path to feature_coverage_cache.json produced by traverse_feature_coverage.py.
# Set to null to disable /api/feature_coverage_v2 (endpoint returns empty cache message).
# Override at runtime via the COVERAGE_CACHE_FILE environment variable.
# Example:
#   feature_coverage_cache_file: "/home/youruser/sootballs_tests/qa_tooling/feature_coverage_cache.json"
feature_coverage_cache_file: null

# Legacy iteration path → sprint label mapping for work items created before
