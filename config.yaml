# ── QA Team Membership ────────────────────────────────────────────────────────
#
# qa_team_roster  (preferred) — date-range based membership.
#   Each entry has:
#     name: display name exactly as shown in ADO (Settings → Users)
#     from: YYYY-MM-DD  first day this person was on the QA team
#     to:   YYYY-MM-DD  last day (inclusive), or omit / null if still active
#
# When a sprint is queried, only members whose from–to range overlaps the
# sprint's dates are included.  This means historical sprints automatically
# show the correct team composition without any per-sprint config changes.
#
# How to handle roster changes:
#   - Member joins QA:      add a new entry with from = their start date
#   - Member leaves QA:     set to = their last day on QA
#   - Member returns later: add a second entry for the new tenure
#   - Loaned from another team (temporary): set a specific from/to window
#
# qa_team_members (fallback) — simple flat list used when qa_team_roster is
# absent or empty.  Fine for single-team setups with no historical changes.
#
# qa_tag — any ADO work item with this tag is always included regardless of
# assignee.  Use this for cross-team automation tasks (e.g. a dev does QA
# automation work for one sprint — just tag their US with sb_qa).

qa_team_roster:
  # IMPORTANT: names must match ADO display names exactly (Settings → Users).
  # Verify each name in ADO if queries return 0 items for a member.
  # "from" dates below are approximate — update to the actual date each person
  # joined / was assigned to the QA team for accurate historical sprint filtering.
